name: Test site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit, Edge Function, and compliance tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.4

      - name: Check Edge Function entrypoints
        run: npm run test:edge

      - name: Run tests
        run: npm test

      - name: Install compliance-test browser
        run: npx playwright install --with-deps chromium

      - name: Run rendered compliance tests
        run: npm run test:compliance
        env:
          VITE_GA_MEASUREMENT_ID: G-TEST123
